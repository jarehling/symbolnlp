[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symbolnlp"
version = "0.2.0"
description = "Non-LLM paraphrasing with variation and structural fidelity reports"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
symbolnlp = "symbolnlp.__main__:main"

[tool.setuptools.packages.find]
include = ["symbolnlp*"]
